name: Extract TOTEM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o totem-billard-management-app.zip
          rm totem-billard-management-app.zip

      - name: Save files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract TOTEM BILLARD application"
          git push
